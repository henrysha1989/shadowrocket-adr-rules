name: Convert ADH Rules to Shadowrocket

on:
  push:
    paths:
      - 'adh-custom.txt'
      - 'direct-custom.list'
      - 'proxy-custom.list'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Converter
        run: |
          python convert.py

      - name: Update README rule counts
        run: |
          python update_readme_counts.py

      - name: Commit and Push Output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reject-custom.list README.md
          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "Auto-convert ADH rules to Shadowrocket format @ $(date '+%Y-%m-%d %H:%M %z')"
            git pull --rebase origin main
            git push
          fi
