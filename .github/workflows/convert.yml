name: Convert ADH Rules to Shadowrocket

on:
  push:
    paths:
      - 'adh-custom.txt'
      - 'direct-custom.list'
      - 'proxy-custom.list'
  workflow_dispatch:

permissions:
  contents: write

# Serialize runs: concurrent runs used to both rewrite the README rule-count line and
# then fight over it during `git pull --rebase` (conflict -> push failed -> counts stale).
concurrency:
  group: convert-adh-rules
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Convert, refresh counts, commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            # Rebase-free: always regenerate on top of the current main, so a concurrent
            # push can never produce a merge conflict. Retry until the push lands.
            git fetch origin main
            git reset --hard origin/main
            python convert.py
            python update_readme_counts.py
            git add reject-custom.list README.md
            if git diff --staged --quiet; then
              echo "No changes detected."
              exit 0
            fi
            git commit -m "Auto-convert ADH rules to Shadowrocket format @ $(date '+%Y-%m-%d %H:%M %z')"
            if git push origin HEAD:main; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push attempt $i failed, retrying against fresh main..."
            sleep 5
          done
          echo "all push attempts failed"
          exit 1
