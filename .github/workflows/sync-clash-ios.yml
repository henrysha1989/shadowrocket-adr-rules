name: sync clash-ios rule sets

# main 上的三张自建拦截表一变，就把它们转成 mihomo classical 文本，同步到 clash-ios 分支。
# 同步脚本本身放在 clash-ios 分支的 mihomo/sync.mjs —— 与数据同处；main 这边只留这个 workflow。
# 两个分支分开管理，clash-ios 不合并回 main。

on:
  push:
    branches: [main]
    paths:
      - bytedance-ad.list
      - soul-ad.list
      - reject-custom.list
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-clash-ios
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 取同步脚本（在 clash-ios 分支上）
        run: |
          git fetch --depth=1 origin clash-ios
          mkdir -p "$RUNNER_TEMP/sync"
          git show origin/clash-ios:mihomo/sync.mjs > "$RUNNER_TEMP/sync/sync.mjs"
          wc -l "$RUNNER_TEMP/sync/sync.mjs"

      - name: 同步规则集
        env:
          REPO_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/sync/sync.mjs"
